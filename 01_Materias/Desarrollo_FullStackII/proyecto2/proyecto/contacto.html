<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | KatEye</title>

    <link rel="stylesheet" href="css/main.css">
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Design Tokens -->
    <link rel="stylesheet" href="css/design-tokens.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/contacto.css">
</head>

<body>
    <div id="header-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h1 class="h3 mb-0">Formulario de Contacto</h1>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form id="form-contacto" novalidate>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Escribe tu nombre completo">
                                <div class="invalid-feedback" id="error-nombre"></div>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo (opcional)</label>
                                <input type="email" id="correo" class="form-control" placeholder="ejemplo@gmail.com">
                                <div class="invalid-feedback" id="error-correo"></div>
                            </div>

                            <div class="mb-3">
                                <label for="contenido" class="form-label">Comentario</label>
                                <textarea id="contenido" class="form-control" rows="5" placeholder="Escribe tu comentario aquí..."></textarea>
                                <div class="form-text text-end" id="contador-contenido">0/500</div>
                                <div class="invalid-feedback" id="error-contenido"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar Mensaje</button>
                            </div>
                        </form>
                        <div class="alert alert-success mt-4" id="mensaje-form" hidden></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

        <div id="footer-container"></div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="js/loadComponents.js"></script>
    <script src="js/validaciones.js"></script>
</body>

</html>
