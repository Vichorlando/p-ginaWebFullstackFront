<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de productos | Kateyes</title>
        <link rel="stylesheet" href="css/admin.css">
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Design Tokens -->
    <link rel="stylesheet" href="css/design-tokens.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin">
    <div class="layout-admin">

        <aside id="sidebar" class="sidebar" data-activo="productos"></aside>

        <main class="contenido">
            <header class="contenido__encabezado">
                <div>
                    <h1>Productos</h1>
                    <p>Lista, busca, edita y crea los productos de la tienda.</p>
                </div>
                <!-- Hipervínculo a la página para agregar -->
                <a class="btn btn-primary" href="productoForm.html">+ Agregar producto</a>
            </header>

            <div class="barra-herramientas">
                <div class="buscador">
                    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <path d="M21 21l-4.3-4.3" />
                    </svg>
                    <input type="search" id="buscar" class="form-control" placeholder="Buscar por nombre o categoría"
                        aria-label="Buscar productos">
                </div>
                <span class="contador-resultados" id="contador" aria-live="polite"></span>
            </div>

            <div class="tabla-envoltorio">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos"></tbody>
                </table>
                <p class="vacio" id="sin-resultados" hidden>No hay productos que coincidan con la búsqueda.</p>
            </div>
        </main>

    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="js/admin.js"></script>
    <script src="js/data.js"></script>
<script>
    // Copia local para poder eliminar sin tocar el catálogo compartido (PRODUCTOS es const)
    let productosAdmin = [...PRODUCTOS];

    const tbody = document.getElementById("tabla-productos");
    const buscador = document.getElementById("buscar");
    const sinResultados = document.getElementById("sin-resultados");
    const contador = document.getElementById("contador");

    const formatearPrecio = v => "$" + v.toLocaleString("es-CL");

    function renderProductos() {
        const q = buscador.value.trim().toLowerCase();
        const lista = productosAdmin.filter(p =>
            p.nombre.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q)
        );

        tbody.innerHTML = lista.map(p => `
            <tr>
                <td>${p.id}</td>
                <td><img class="tabla__miniatura" src="${p.imagenes[0]}" alt="${escapar(p.nombre)}"
                         onerror="this.onerror=null;this.src='${IMG_PLACEHOLDER}'"></td>
                <td>${escapar(p.nombre)}</td>
                <td><span class="etiqueta">${escapar(p.categoria)}</span></td>
                <td class="precio">${
                    p.precioAnterior
                        ? `<div class="precio-oferta">
                               <span class="precio-anterior">${formatearPrecio(p.precioAnterior)}</span>
                               <span class="precio-actual">${formatearPrecio(p.precio)}</span>
                           </div>`
                        : `<span class="precio-normal">${formatearPrecio(p.precio)}</span>`
                }</td>
                <td>
                    <div class="btn-group btn-group-sm">
                        <a class="btn btn-outline-secondary" href="productoForm.html?id=${p.id}">Editar</a>
                        <button class="btn btn-outline-danger" data-eliminar="${p.id}">Eliminar</button>
                    </div>
                </td>
            </tr>
        `).join("");

        sinResultados.hidden = lista.length > 0;
        contador.textContent = `${lista.length} de ${productosAdmin.length} productos`;
    }

    buscador.addEventListener("input", renderProductos);

    tbody.addEventListener("click", e => {
        const btn = e.target.closest("[data-eliminar]");
        if (!btn) return;
        const id = Number(btn.dataset.eliminar);
        const p = productosAdmin.find(x => x.id === id);
        if (p && confirm(`¿Eliminar "${p.nombre}"?`)) {
            productosAdmin = productosAdmin.filter(x => x.id !== id);
            renderProductos();
        }
    });

    renderProductos();
</script>
</body>

</html>
