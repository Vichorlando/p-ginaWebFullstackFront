<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración | Kateyes</title>
        <link rel="stylesheet" href="css/admin.css">
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Design Tokens -->
    <link rel="stylesheet" href="css/design-tokens.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin">
    <div class="layout-admin">

        <!-- Menú lateral (se genera en js/admin.js) -->
        <aside id="sidebar" class="sidebar" data-activo="home"></aside>

        <!-- Contenido principal -->
        <main class="contenido">
            <header class="contenido__encabezado">
                <div>
                    <h1>Panel principal</h1>
                    <p>Resumen general de la tienda.</p>
                </div>
            </header>

            <!-- Espacio central libre para colocar contenido -->
            <section class="area-central" id="area-central">
                <p>Aquí irá el contenido del panel.</p>
            </section>
        </main>

    </div>

    <script src="js/admin.js"></script>
</body>

</html>
