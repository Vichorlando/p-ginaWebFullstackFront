<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | KatEye</title>
        <link rel="stylesheet" href="./css/main.css">
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Design Tokens -->
    <link rel="stylesheet" href="css/design-tokens.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- Header dinámico -->
    <div id="header-container"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                             <h1 class="h3 mb-3 fw-normal">Iniciar Sesión</h1>
                        </div>
                        <form id="form-login" novalidate>
                            <div class="form-floating mb-3">
                                <input type="email" id="email" class="form-control" placeholder="nombre@ejemplo.com" autocomplete="email">
                                <label for="email">Correo Electrónico</label>
                                <div class="invalid-feedback" id="error-email"></div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" id="password" class="form-control" placeholder="Contraseña" autocomplete="current-password">
                                <label for="password">Contraseña</label>
                                <div class="invalid-feedback" id="error-password"></div>
                            </div>

                            <button class="w-100 btn btn-lg btn-primary" type="submit">Iniciar Sesión</button>
                        </form>
                        <div class="alert alert-info mt-4" id="mensaje-form" hidden></div>
                        <hr class="my-4">
                        <p class="text-center">¿No tienes una cuenta? <a href="registroUsuario.html">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer dinámico -->
        <div id="footer-container"></div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="./js/loadComponents.js"></script>
    <script src="./js/validaciones.js"></script>
</body>

</html>
