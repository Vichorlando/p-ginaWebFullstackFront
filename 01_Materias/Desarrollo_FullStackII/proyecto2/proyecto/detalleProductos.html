<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto | Kateyes</title>
    <link rel="icon" type="image/jpeg" href="img/Tienda.jpg">
    <link rel="stylesheet" href="css/main.css">
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Design Tokens -->
    <link rel="stylesheet" href="css/design-tokens.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="header-container"></div>

<main class="container my-5">
        <div class="row" id="detalle-producto">
            <!-- El contenido se genera con JavaScript -->
        </div>
    </main>

    <!-- ================= PRODUCTOS RELACIONADOS ================= -->
    <section class="album py-5 bg-light" id="relacionados" hidden>
        <div class="container">
            <h2 class="text-center mb-5">Productos Relacionados</h2>
            <div id="carrusel-relacionados" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
                <!-- Contenido generado por JS -->
            </div>
        </div>
    </section>
    <!-- ================= CARRITO OFFCANVAS ================= -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="panel-carrito" aria-labelledby="panel-carrito-label">
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="panel-carrito-label">Tu Carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <div id="items-carrito" class="items-carrito">
          <!-- Los items del carrito se renderizarán aquí -->
          <p class="text-center text-muted">Tu carrito está vacío.</p>
        </div>
      </div>
      <div class="offcanvas-footer p-3 border-top">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="h5 m-0">Total:</p>
            <p class="h5 m-0" id="total-carrito">$0</p>
        </div>
        <div class="d-grid">
            <button id="btn-ir-pagar" class="btn btn-primary">Ir a pagar</button>
        </div>
      </div>
    </div>

    <!-- Botón flotante para abrir el carrito -->
    <button id="btn-carrito" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-3 p-3 lh-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#panel-carrito" aria-controls="panel-carrito" aria-label="Abrir carrito">
        <i class="bi-cart-fill fs-4"></i>
        <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
    </button>
        <div id="footer-container"></div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="js/loadComponents.js"></script>
    <script src="js/data.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/detalleProductos.js"></script>
</body>

</html>
