<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | KatEye</title>
        <link rel="stylesheet" href="css/main.css">
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Design Tokens -->
    <link rel="stylesheet" href="css/design-tokens.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/productos.css">
    <link rel="stylesheet" href="css/carrito.css">
</head>

<body>
    <div id="header-container"></div>

    <main class="container my-5">
        <div class="row">
            <!-- ================= FILTROS ================= -->
            <aside class="col-lg-3">
                <div class="p-3 border rounded-3 bg-light">
                    <h2 class="h4 mb-3">Filtros</h2>

                    <div class="grupo-filtro mb-4">
                        <h3 class="h5">Categorías</h3>
                        <div id="filtro-categorias"></div>
                    </div>

                    <div class="grupo-filtro mb-4">
                        <h3 class="h5">Precio</h3>
                        <div class="mb-2">
                            <label for="precio-min" class="form-label">Mínimo</label>
                            <input type="number" id="precio-min" class="form-control" min="0" step="1000" value="0">
                        </div>
                        <div class="mb-3">
                            <label for="precio-max" class="form-label">Máximo</label>
                            <input type="number" id="precio-max" class="form-control" min="0" step="1000" value="100000">
                        </div>
                    </div>

                    <div class="d-grid">
                        <button id="btn-limpiar-filtros" class="btn btn-secondary">Limpiar filtros</button>
                    </div>
                </div>
            </aside>

            <!-- ================= CATÁLOGO ================= -->
            <section class="col-lg-9">
                <h1 class="mb-4">Productos</h1>
                <div id="grid-productos" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
                <div id="sin-resultados" class="alert alert-info mt-4" hidden>
                    No hay productos que coincidan con los filtros.
                </div>
            </section>
        </div>
    </main>

    <!-- ================= CARRITO OFFCANVAS ================= -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="panel-carrito" aria-labelledby="panel-carrito-label">
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="panel-carrito-label">Tu Carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <div id="items-carrito" class="items-carrito">
          <!-- Los items del carrito se renderizarán aquí -->
          <p class="text-center text-muted">Tu carrito está vacío.</p>
        </div>
      </div>
      <div class="offcanvas-footer p-3 border-top">
        <!-- Elemento para mostrar el ahorro -->
        <div id="contenedor-ahorro" class="d-flex justify-content-between text-success fw-bold mb-2" style="display: none !important;">
            <span>Ahorro total:</span>
            <span>$<span id="total-ahorro">0</span></span>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="h5 m-0">Total:</p>
            <p class="h5 m-0" id="total-carrito">$0</p>
        </div>
        <div class="d-grid">
            <button id="btn-ir-pagar" class="btn btn-primary">Ir a pagar</button>
        </div>
      </div>
    </div>

    <!-- Botón flotante para abrir el carrito -->
    <button id="btn-carrito" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-3 p-3 lh-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#panel-carrito" aria-controls="panel-carrito" aria-label="Abrir carrito">
        <i class="bi-cart-fill fs-4"></i>
        <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
    </button>

        <div id="footer-container"></div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="js/loadComponents.js"></script>
    <script src="js/data.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/producto.js"></script>
